[package]
name = "final_try"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
grammers-client = "0.6"
grammers-tl-types = "0.6"
rand = "0.8"
grammers-session = "=0.5.2"
log = "0.4.28"
url = "2.5.7"
csv = "1.3.1"
chrono = "0.4.42"

